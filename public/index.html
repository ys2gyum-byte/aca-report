<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>입반테스트 성적표 생성기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#101828; --ink2:#475467; --ink3:#98a2b3;
  --navy:#12263f; --navy2:#1d3a5c; --gold:#a9843f; --gold-l:#c9a961;
  --paper:#fff; --bg:#f2f3f5; --line:#e4e7ec; --line2:#f0f1f3;
  --ok:#1a7f5a; --okbg:#e8f5ef; --warn:#b7791f; --warnbg:#fdf4e3; --bad:#b42318; --badbg:#fef3f2;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --sh2:0 4px 8px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
  --f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:var(--navy2)}

/* ---------- app chrome ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:var(--sh2)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:15px}
.brand .mk{width:8px;height:16px;background:var(--gold);border-radius:2px;transform:translateY(2px)}
.brand small{font-weight:400;color:#b6c4d4;font-size:12px;letter-spacing:0}
.top .sp{flex:1}
.top-act{display:flex;gap:8px;align-items:center}
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:49}
.tabs-in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:12px 15px;border:0;background:none;cursor:pointer;color:var(--ink2);font-weight:600;font-size:13.5px;
  border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.tab .n{background:var(--line);color:var(--ink2);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700}
.tab.on .n{background:var(--navy);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 90px}
.pane{display:none}
.pane.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card>h3{padding:14px 18px;border-bottom:1px solid var(--line2);font-size:14.5px;display:flex;align-items:center;gap:9px}
.card>h3 .hint{font-weight:400;font-size:12px;color:var(--ink3);letter-spacing:0}
.card>h3 .sp{flex:1}
.body{padding:16px 18px}
.body.tight{padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:block}
label.f>span{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px;letter-spacing:0}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(29,58,92,.1)}
textarea{resize:vertical;line-height:1.6}
.btn{padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:hover{background:#f8f9fa;border-color:#d3d8de}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.p:hover{background:var(--navy2)}
.btn.g{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.g:hover{background:#b8944c}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.dg{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink3);font-size:12.5px}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:6px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left}
table.t th{background:#fafbfc;font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:0;white-space:nowrap}
table.t td.n,table.t th.n{text-align:center}
table.t tbody tr:hover{background:#fcfcfd}
table.t tbody tr.dm td,table.mk tbody tr.dm .stick,table.mk tbody tr.dm .stick2{background:#fdf9ef;color:#8a6a2a}
table.mk tbody tr.dm .mkc{opacity:.72}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0}
.pill.a{background:var(--okbg);color:var(--ok)}
.pill.b{background:var(--warnbg);color:var(--warn)}
.pill.c{background:var(--badbg);color:var(--bad)}
.pill.n{background:var(--line2);color:var(--ink2)}
.pill.v{background:#eef2f8;color:var(--navy2)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:200;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}
.modal.on{display:flex}
.modal .sheet{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal h3{padding:16px 20px;border-bottom:1px solid var(--line2)}
.modal .mbody{padding:18px 20px}
.modal .foot{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ---------- 채점 그리드 ---------- */
.gridwrap{overflow:auto;max-height:64vh;border-top:1px solid var(--line)}
table.mk{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
table.mk th,table.mk td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0}
table.mk thead th{position:sticky;top:0;z-index:3;background:#fafbfc;padding:6px 4px;font-size:11px;font-weight:700;color:var(--ink2);text-align:center;min-width:38px}
table.mk thead th.sub{background:#eef2f8;color:var(--navy);border-bottom:1px solid var(--line)}
table.mk .stick{position:sticky;left:0;z-index:2;background:#fff;padding:6px 10px;min-width:130px;text-align:left;font-weight:600}
table.mk thead .stick{z-index:4;background:#fafbfc}
table.mk .stick2{position:sticky;left:130px;z-index:2;background:#fff;padding:6px 8px;min-width:70px;text-align:center;font-weight:700;color:var(--navy)}
table.mk thead .stick2{z-index:4;background:#fafbfc}
table.mk tbody tr:hover .stick,table.mk tbody tr:hover .stick2{background:#f7f9fc}
.mkc{width:100%;height:30px;border:0;background:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink3);text-align:center}
.mkc:hover{background:#f0f3f7}
.mkc.O{color:var(--ok);background:var(--okbg)}
.mkc.T{color:var(--warn);background:var(--warnbg)}
.mkc.X{color:var(--bad);background:var(--badbg)}
.mkc:focus{outline:2px solid var(--navy2);outline-offset:-2px}
.mkn{width:100%;height:30px;border:0;background:none;text-align:center;font-weight:600;padding:0}
.mkn:focus{outline:2px solid var(--navy2);outline-offset:-2px;background:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.legend b{font-size:13px}

/* ---------- 분석 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line2)}
.stat{background:#fff;padding:14px 16px}
.stat .k{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:0}
.stat .v{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:2px}
.bar{height:7px;background:var(--line2);border-radius:5px;overflow:hidden;min-width:54px}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--navy2)}
.bar.a>i{background:var(--ok)}.bar.b>i{background:var(--warn)}.bar.c>i{background:var(--bad)}

/* ---------- 성적표 ---------- */
#preview{background:#5c6470;padding:22px;border-radius:var(--r);overflow:auto}
.report{width:210mm;min-height:297mm;background:#fff;margin:0 auto 22px;padding:14mm 14mm 12mm;color:#1a1f2b;
  font-size:9.6pt;line-height:1.48;box-shadow:0 6px 20px rgba(0,0,0,.28);position:relative;display:flex;flex-direction:column}
.report .rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.2pt solid var(--navy);padding-bottom:7pt}
.report .rhead .l .ac{font-size:8.4pt;font-weight:700;color:var(--gold);letter-spacing:.16em}
.report .rhead .l h1{font-size:17pt;margin-top:3pt;letter-spacing:-.03em;color:var(--navy)}
.report .rhead .l .sub{font-size:8.6pt;color:#5a6474;margin-top:3pt}
.report .rhead .r{text-align:right;font-size:8pt;color:#5a6474;line-height:1.6}
.report .rhead .r b{color:var(--navy);font-size:8.6pt}

.rmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #dfe3e9;border-radius:5px;overflow:hidden;margin-top:9pt}
.rmeta div{padding:4pt 8pt;border-right:1px solid #eceff3;border-bottom:1px solid #eceff3}
.rmeta div:nth-child(4n){border-right:0}
.rmeta div:nth-last-child(-n+4){border-bottom:0}
.rmeta .k{font-size:7.4pt;color:#8b95a5;font-weight:700;letter-spacing:.02em}
.rmeta .v{font-size:9.6pt;font-weight:700;margin-top:1pt;color:#1a1f2b}

.rsec{margin-top:9.5pt}
.rsec>.h{display:flex;align-items:center;gap:6pt;font-size:10pt;font-weight:700;color:var(--navy);
  border-left:2.6pt solid var(--gold);padding-left:6pt;margin-bottom:6pt;letter-spacing:-.02em}
.rsec>.h .tip{font-size:7.6pt;font-weight:500;color:#8b95a5;letter-spacing:0}

.rtop{display:grid;grid-template-columns:1.05fr 1fr;gap:10pt;margin-top:10pt;align-items:stretch}
.scorebox{background:linear-gradient(160deg,#12263f,#1d3a5c);color:#fff;border-radius:6px;padding:9pt 11pt;display:flex;flex-direction:column;justify-content:center}
.scorebox .who{font-size:8pt;color:#a9c0d8;letter-spacing:.02em}
.scorebox .who b{color:#fff;font-size:12pt;letter-spacing:-.02em;margin-right:3pt}
.scorebox .big{display:flex;align-items:baseline;gap:4pt;margin-top:4pt}
.scorebox .big .n{font-size:29pt;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.scorebox .big .d{font-size:10pt;color:#a9c0d8;font-weight:600}
.scorebox .kv{display:flex;gap:12pt;margin-top:7pt;padding-top:6pt;border-top:1px solid rgba(255,255,255,.18)}
.scorebox .kv div{font-size:7.6pt;color:#a9c0d8}
.scorebox .kv b{display:block;font-size:11pt;color:#fff;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.scorebox .kv b em{font-style:normal;font-size:7.6pt;color:#a9c0d8;font-weight:600}

.distbox{border:1px solid #dfe3e9;border-radius:6px;padding:7pt 9pt}
.distbox .t{font-size:7.6pt;font-weight:700;color:#5a6474;display:flex;justify-content:space-between}
.distbox .t em{font-style:normal;color:var(--gold);font-weight:700}

table.rt{width:100%;border-collapse:collapse;font-size:8.3pt}
table.rt th{background:#f5f7fa;color:#48536a;font-weight:700;font-size:7.4pt;padding:4pt 4pt;border:1px solid #e2e6ec;text-align:center;letter-spacing:0}
table.rt td{padding:2.5pt 4pt;border:1px solid #eceff3;text-align:center;font-variant-numeric:tabular-nums}
table.rt td.l{text-align:left}
table.rt tbody tr:nth-child(even){background:#fbfcfd}
table.rt .oO{color:var(--ok);font-weight:800}
table.rt .oT{color:var(--warn);font-weight:800}
table.rt .oX{color:var(--bad);font-weight:800}
table.rt .oN{color:#c3c9d2;font-weight:700}
.dv{display:inline-block;padding:.6pt 4pt;border-radius:3px;font-size:7pt;font-weight:700;white-space:nowrap}
.d1{background:#eaf6f0;color:#1a7f5a}.d2{background:#eef6f1;color:#2c7a58}.d25{background:#eef4f8;color:#2f6690}
.d3{background:#f3f0fa;color:#6b4fa8}.d35{background:#faf1e8;color:#9a6b32}.d4{background:#fdf1e5;color:#b7791f}.d5{background:#fdeceb;color:#b42318}

.areas{display:grid;grid-template-columns:1fr 1fr;gap:4pt 14pt}
.arow{display:grid;grid-template-columns:74pt 1fr 46pt;gap:5pt;align-items:center;font-size:8pt}
.arow .nm{font-weight:700;color:#333c4d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .bg{height:7pt;background:#eef0f3;border-radius:4px;position:relative;overflow:hidden}
.arow .bg i{display:block;height:100%;border-radius:4px}
.arow .bg .avg{position:absolute;top:-1pt;bottom:-1pt;width:1.4pt;background:#98a2b3}
.arow .pc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:7.8pt}

.cbox{border:1px solid #e2e6ec;border-radius:6px;overflow:hidden;margin-bottom:6pt;break-inside:avoid}
.cbox>.ch{background:#f7f9fb;padding:4.5pt 9pt;font-size:8.6pt;font-weight:700;color:var(--navy);
  border-bottom:1px solid #e9edf2;display:flex;align-items:center;gap:6pt}
.cbox>.ch .sc{margin-left:auto;font-size:7.8pt;color:#5a6474;font-weight:600}
.cbox .cb{padding:5pt 9pt}
.cline{display:flex;gap:6pt;font-size:8.5pt;line-height:1.55;margin-bottom:2.8pt}
.cline:last-child{margin-bottom:0}
.cline .tag{flex:none;width:38pt;font-size:7.2pt;font-weight:800;padding:1.2pt 0;text-align:center;border-radius:3px;height:fit-content;margin-top:1pt}
.cline .tag.g{background:#e8f5ef;color:#1a7f5a}
.cline .tag.w{background:#fdf1e5;color:#b7791f}
.cline .tag.n{background:#eef2f8;color:#3c5c80}
.cline p{margin:0;color:#2b3241}
.cline p b{color:var(--navy);font-weight:700}
.summary{background:#fbfaf7;border:1px solid #ecdfc6;border-radius:6px;padding:8pt 10pt;font-size:8.7pt;line-height:1.65;color:#3a3630}
.summary b{color:#8a6a2a}

.report.dense{font-size:9pt;padding:12mm 12mm 10mm}
.report.dense .rmeta div{padding:3pt 7pt}
.report.dense .rsec{margin-top:8pt}
.report.dense table.rt td{padding:1.8pt 3pt}
.report.dense table.rt{font-size:7.9pt}
.report.dense .cline{font-size:8pt;line-height:1.5;margin-bottom:2.2pt}
.report.dense .cbox .cb{padding:4pt 8pt}
.report.dense .scorebox .big .n{font-size:26pt}
.rfoot{margin-top:auto;padding-top:8pt;border-top:1px solid #e2e6ec;display:flex;justify-content:space-between;align-items:flex-end;
  font-size:7.2pt;color:#98a2b3;line-height:1.5}
.rfoot .l b{color:var(--navy);font-size:8pt}
.stamp{position:absolute;right:14mm;bottom:16mm;opacity:.07;font-size:34pt;font-weight:800;color:var(--navy);transform:rotate(-14deg);letter-spacing:-.04em}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .top,.tabs,.wrap,.toast,.modal{display:none!important}
  #printArea{display:block!important}
  .report{width:210mm;min-height:297mm;box-shadow:none;margin:0;page-break-after:always;break-after:page}
  .report:last-child{page-break-after:auto;break-after:auto}
}
/* 성적표는 항상 A4 고정 폭으로 렌더링합니다 (창 크기에 따라 인쇄물이 달라지지 않도록) */
@media(max-width:900px){
  .body[style*="grid-template-columns:250px"]{display:block!important}
  #preview{padding:12px}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="brand"><span class="mk"></span><span id="brandName">성적표 생성기</span><small id="brandSub">입반테스트 분석 리포트</small></div>
  <div class="sp"></div>
  <div class="top-act">
    <span class="muted" id="syncState" style="color:#b6c4d4;font-size:12px"></span>
    <button class="btn ghost sm" onclick="openSync()">☁︎ 공유 설정</button>
    <button class="btn ghost sm" onclick="openData()">데이터</button>
  </div>
</div></div>

<div class="tabs"><div class="tabs-in" id="tabs"></div></div>

<div class="wrap">
  <div id="hint"></div>
  <div class="pane" id="pane-exam"></div>
  <div class="pane" id="pane-questions"></div>
  <div class="pane" id="pane-scores"></div>
  <div class="pane" id="pane-analysis"></div>
  <div class="pane" id="pane-report"></div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="modalSheet"></div></div>

<script>
/* ============================================================
   0. 상수 · 상태 · 저장
============================================================ */
const UNIT_PRESET={
  '물리':['역학','전자기','파동·광학','열·유체','현대물리'],
  '화학':['물질의 구성','화학 반응','기체·용액','산과 염기','산화·환원'],
  '수학':['대수','기하','함수','정수·조합','확률과 통계'],
  '생명과학':['세포','유전','항상성','생태·진화'],
  '지구과학':['지질','대기·해양','천문','지구시스템']
};
const SCHOOLS=['한국과학영재학교','서울과학고등학교','경기과학고등학교','대전과학고등학교','광주과학고등학교','대구과학고등학교','인천과학예술영재학교','세종과학예술영재학교','전국 영재학교 공통'];
const MARKS={O:'O',T:'△',X:'X'};
const BUILD='__BUILD__';                 // 배포할 때 실제 시각으로 치환됩니다
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>(n===null||n===undefined||isNaN(n))?'-':(Math.round(n*10**d)/10**d).toFixed(d).replace(/\.0+$/,'');
const pct=n=>isNaN(n)?'-':Math.round(n*100)+'%';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function blankSubject(name){
  const units=UNIT_PRESET[name]||[];

function migrate(raw){
  raw=raw||{};
  const legacy1=Array.isArray(raw.subjects)&&!(raw.papers&&raw.papers.length);       // v1 = 시험지 하나
  const legacy2=!raw.exams||!raw.exams.length;                                        // v2 = 시험 하나
  const b=blankState();
  const s=Object.assign(b,raw);
  s.cfg=Object.assign(b.cfg,raw.cfg||{});
  s.edits=s.edits||{};
  const m=raw.meta||{};
  if(legacy2){                                    // v1·v2 → v3 : meta 를 학원 정보 + 시험 하나로 나눕니다
    s.brand=Object.assign(b.brand,{academy:m.academy||'',tagline:m.tagline||b.brand.tagline,
      contact:m.contact||'',stampText:m.stampText||'',notice:m.notice||b.brand.notice});
    const ex={id:uid(),examName:m.examName||'',examType:m.examType||'입반테스트',
      examDate:m.examDate||b.exams[0].examDate,school:m.school||'',target:m.target||'',duration:m.duration||''};
    s.exams=[ex];
    if(legacy1)s.papers=[{id:uid(),examId:ex.id,name:m.examType||'기본형',target:m.target||'',note:'',subjects:raw.subjects}];
    (s.papers||[]).forEach(p=>p.examId=ex.id);
  }else s.brand=Object.assign(b.brand,raw.brand||{});
  delete s.subjects;delete s.meta;
  if(!s.exams||!s.exams.length)s.exams=[blankExam('')];
  s.exams.forEach(e=>{e.id=e.id||uid()});
  if(!s.papers||!s.papers.length)s.papers=[blankPaper('기본형',s.exams[0].id)];
  s.papers.forEach(p=>{
    p.id=p.id||uid();p.name=p.name||'기본형';p.subjects=p.subjects||[];
    p.view=p.view||'subject';                                   // 'subject' 과목별 / 'flat' 문항 순서대로
    p.cols=Object.assign({},DEF_COLS,{sub:!!p.useSub},p.cols||{});
    delete p.useSub;
    if(!p.examId||!s.exams.some(e=>e.id===p.examId))p.examId=s.exams[0].id;
    p.subjects.forEach(sb=>{sb.id=sb.id||uid();sb.units=sb.units||[];
      sb.questions=(sb.questions||[]).map((q,i)=>Object.assign({n:i+1,no:0,pt:10,unit:'',topic:'',sub:'',type:'',diff:''},q))});
  });
  (s.students||[]).forEach(st=>{st.marks=st.marks||{};
    if(!st.paperId||!s.papers.some(p=>p.id===st.paperId))st.paperId=s.papers[0].id});
  s.v=3;
  return s;
}

/* ============================================================
   1. 계산 엔진
============================================================ */
const qkey=(sid,n)=>sid+':'+n;
function qScore(q,mark){
  if(mark===undefined||mark===null||mark==='')return null;          // 미채점/무응답
  if(mark==='O')return q.pt;
  if(mark==='T')return Math.round(q.pt*S.cfg.partial*10)/10;
  if(mark==='X')return 0;
  const v=Number(mark);return isNaN(v)?null:clamp(v,0,q.pt);
}
function markOf(st,sid,n){return st.marks[qkey(sid,n)]}
function markKind(q,m){                                             // 'O'|'T'|'X'|'N'
  if(m==='O'||m==='T'||m==='X')return m;
  if(m===undefined||m===null||m==='')return 'N';
  const v=Number(m);if(isNaN(v))return 'N';
  if(v>=q.pt)return 'O'; if(v<=0)return 'X'; return 'T';
}
const subjTotal=sb=>sb.questions.reduce((a,q)=>a+(Number(q.pt)||0),0);
const grandTotal=p=>((p||P()).subjects).reduce((a,sb)=>a+subjTotal(sb),0);
const qCount=p=>((p||P()).subjects).reduce((a,sb)=>a+sb.questions.length,0);

function studentScore(st,sb){
  let got=0,ans=0;
  sb.questions.forEach(q=>{const v=qScore(q,markOf(st,sb.id,q.n));if(v!==null){got+=v;ans++}});
  return {got,total:subjTotal(sb),answered:ans,rate:subjTotal(sb)?got/subjTotal(sb):0};
}
function studentTotal(st){
  const p=paperOf(st);
  let got=0;p.subjects.forEach(sb=>got+=studentScore(st,sb).got);
  const t=grandTotal(p);return {got,total:t,rate:t?got/t:0};
}
function stats(arr){
  const n=arr.length;if(!n)return {n:0,mean:0,sd:0,max:0,min:0,median:0};
  const mean=arr.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(arr.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const s=arr.slice().sort((a,b)=>a-b);
  const median=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
  return {n,mean,sd,max:s[n-1],min:s[0],median};
}
/* 시험지 단위 분석 — 통계·석차·난이도는 같은 시험지 응시자끼리만 비교합니다 */
function analyze(p){
  p=p||P();
  const list=roster(p);
  const A={paper:p,roster:list,subjects:[],total:null,qstat:{},areaClass:{}};
  A.total=stats(list.map(st=>studentTotal(st).got));
  A.total.total=grandTotal(p);
  p.subjects.forEach(sb=>{
    const rows=list.map(st=>studentScore(st,sb).got);
    const ss=stats(rows);ss.total=subjTotal(sb);ss.id=sb.id;ss.name=sb.name;
    A.subjects.push(ss);
    sb.questions.forEach(q=>{
      const vals=[],kinds={O:0,T:0,X:0,N:0};
      list.forEach(st=>{
        const m=markOf(st,sb.id,q.n);const v=qScore(q,m);
        kinds[markKind(q,m)]++;
        vals.push(v===null?0:v);
      });
      const mean=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
      const rate=q.pt?mean/q.pt:0;
      A.qstat[qkey(sb.id,q.n)]={mean,rate,kinds,correct:kinds.O,n:list.length,
        diff:q.diff||autoDiff(rate),auto:autoDiff(rate),band:diffBand(rate)};
    });
    const g=groupAreas(sb);
    Object.keys(g).forEach(u=>{
      let got=0,tp=0;
      list.forEach(st=>g[u].forEach(q=>{const v=qScore(q,markOf(st,sb.id,q.n));got+=(v===null?0:v);tp+=q.pt}));
      A.areaClass[sb.id+'|'+u]=tp?got/tp:0;
    });
  });
  return A;
}
function groupAreas(sb){
  const g={};sb.questions.forEach(q=>{const u=(q.unit||'').trim()||'기타';(g[u]=g[u]||[]).push(q)});return g;
}
const DIFFS=['최하','하','중하','중','중상','상','최상'];
function autoDiff(rate){                 // 정답(득점)률 → 난이도
  if(rate>=.85)return '최하';if(rate>=.72)return '하';if(rate>=.60)return '중하';
  if(rate>=.45)return '중';if(rate>=.33)return '중상';if(rate>=.20)return '상';return '최상';
}
const dispNo=q=>(q.no||q.n);             // 표기용 문항번호(붙여넣기로 들어온 통합 번호)
function diffBand(rate){return rate>=.7?'easy':(rate>=.4?'mid':'hard')}
const DIFFCLS={'최하':'d1','하':'d2','중하':'d25','중':'d3','중상':'d35','상':'d4','최상':'d5'};
function rankOf(st,A){
  const list=A?.roster||roster(paperOf(st));
  const my=studentTotal(st).got;
  const higher=list.filter(o=>studentTotal(o).got>my).length;
  const rank=higher+1, n=list.length;
  return {rank,n,pctl:n>1?Math.round((1-(rank-1)/n)*100):100};
}
function zOf(v,ss){return ss.sd>0?(v-ss.mean)/ss.sd:0}

/* ============================================================
   2. 코멘트 자동 생성 엔진
============================================================ */
const NUM=n=>['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열'][n]||n;
function hasJong(w){                                   // 받침 유무 → 조사 선택
  const s=String(w||'').trim().replace(/[」』\)\]\s·]+$/,'');
  if(!s)return false;const c=s.charCodeAt(s.length-1);
  if(c<0xAC00||c>0xD7A3)return /[1360-9lmnr]$/i.test(s);
  return (c-0xAC00)%28!==0;
}
const jsa=(w,a,b)=>hasJong(w)?a:b;                     // jsa('역학','은','는')
function bandName(z,rate){
  if(z>=1.2)return '최상위권';if(z>=.6)return '상위권';if(z>=-.3)return '중상위권';
  if(z>=-1)return '중위권';return '기초 보완이 필요한 단계';
}
function subjDetail(st,sb,A){
  const sc=studentScore(st,sb);
  const areas=[],g=groupAreas(sb);
  Object.keys(g).forEach(u=>{
    const qs=g[u];let got=0,tp=0,blank=0;
    qs.forEach(q=>{const m=markOf(st,sb.id,q.n);const v=qScore(q,m);if(v===null)blank++;got+=(v===null?0:v);tp+=q.pt});
    areas.push({unit:u,n:qs.length,got,tp,rate:tp?got/tp:0,cls:A.areaClass[sb.id+'|'+u]||0,blank});
  });
  const buckets={easy:[],mid:[],hard:[]};
  sb.questions.forEach(q=>{
    const qs=A.qstat[qkey(sb.id,q.n)];const m=markOf(st,sb.id,q.n);
    buckets[qs.band].push({q,qs,kind:markKind(q,m),val:qScore(q,m)});
  });
  const all=[].concat(buckets.easy,buckets.mid,buckets.hard);
  const types={};                                        // 문항 유형별 득점 (서술형 등)
  sb.questions.forEach(q=>{
    const t=(q.type||'').trim();if(!t)return;
    const v=qScore(q,markOf(st,sb.id,q.n));
    (types[t]=types[t]||{n:0,got:0,tp:0}); types[t].n++; types[t].got+=(v===null?0:v); types[t].tp+=q.pt;
  });
  Object.values(types).forEach(x=>x.rate=x.tp?x.got/x.tp:0);
  return {sc,areas,types,buckets,
    blanks:all.filter(x=>x.kind==='N').length,
    easyMiss:buckets.easy.filter(x=>x.kind!=='O'),
    midMiss:buckets.mid.filter(x=>x.kind==='X'||x.kind==='N'),
    hardSolved:buckets.hard.filter(x=>x.kind==='O'),
    hardPartial:buckets.hard.filter(x=>x.kind==='T'),
    hardMiss:buckets.hard.filter(x=>x.kind==='X'||x.kind==='N'),
    partials:all.filter(x=>x.kind==='T')};
}
function genComments(st,A){
  const T=studentTotal(st), z=zOf(T.got,A.total), rk=rankOf(st,A), band=bandName(z,T.rate);
  const out={band,lead:'',good:[],bad:[],subj:[],special:[]};
  /* ---- 전체 총평 ---- */
  const dm=T.got-A.total.mean;
  out.lead=`총점 <b>${fmt(T.got)}점</b> / ${fmt(T.total)}점(득점률 ${pct(T.rate)})으로, 응시자 평균 ${fmt(A.total.mean)}점을 `
    +(Math.abs(dm)<.5?'거의 그대로 유지했습니다.':(dm>0?`<b>${fmt(dm)}점 상회</b>합니다.`:`${fmt(-dm)}점 하회합니다.`))
    +` 응시자 분포에서 현재 위치는 <b>${band}</b>에 해당합니다.`;

  const SUBJ=A.paper.subjects;
  const det={};SUBJ.forEach(sb=>det[sb.id]=subjDetail(st,sb,A));
  const rates=SUBJ.map(sb=>({sb,r:det[sb.id].sc.rate}));
  const hi=rates.slice().sort((a,b)=>b.r-a.r)[0], lo=rates.slice().sort((a,b)=>a.r-b.r)[0];
  const gap=rates.length>1?hi.r-lo.r:0;

  // 전체 강점
  if(T.rate>=.75)out.good.push(`전 과목에 걸쳐 배점의 ${pct(T.rate)}를 확보해, 출제 범위 전반의 개념이 고르게 정착되어 있습니다.`);
  if(z>=.6&&A.total.n>3)out.good.push(`평균 대비 편차(표준편차 ${fmt(A.total.sd)}점) 기준으로 상위 구간에 안정적으로 위치합니다.`);
  if(rates.length>1&&gap<=.12)out.good.push(`<b>${rates.map(r=>r.sb.name).join('·')}</b> 간 득점률 차이가 ${Math.round(gap*100)}%p로 작아, 특정 과목에 의존하지 않는 균형 잡힌 학습이 이루어지고 있습니다.`);
  const totHardSolved=SUBJ.reduce((a,sb)=>a+det[sb.id].hardSolved.length,0);
  if(totHardSolved>=2)out.good.push(`응시자 정답률이 낮았던 고난도 문항을 ${NUM(totHardSolved)} 문항 해결했습니다. 처음 보는 조건에서도 스스로 실마리를 찾아내는 힘이 있습니다.`);

  // 전체 보완
  const totEasyMiss=SUBJ.reduce((a,sb)=>a+det[sb.id].easyMiss.length,0);
  const totBlank=SUBJ.reduce((a,sb)=>a+det[sb.id].blanks,0);
  const totPartial=SUBJ.reduce((a,sb)=>a+det[sb.id].partials.length,0);
  if(gap>=.2)out.bad.push(`<b>${hi.sb.name}(${pct(hi.r)})</b>${jsa(hi.sb.name,'과','와')} <b>${lo.sb.name}(${pct(lo.r)})</b>의 격차가 ${Math.round(gap*100)}%p입니다. 총점보다 ${lo.sb.name}의 공백을 먼저 메우는 것이 전체 성적을 끌어올리는 가장 빠른 길입니다.`);
  if(totEasyMiss>=2)out.bad.push(`다수가 맞힌 기본 문항에서 ${NUM(totEasyMiss)} 문항을 놓쳤습니다. 개념의 문제라기보다 <b>조건 확인과 검토 습관</b>에서 발생한 손실이며, 실전에서 가장 먼저 줄일 수 있는 실점입니다.`);
  if(totPartial>=3)out.bad.push(`부분 득점이 ${NUM(totPartial)} 문항으로, 풀이의 방향은 잡았으나 <b>끝까지 완결하지 못한 문항</b>이 반복됩니다. 답을 내는 마지막 단계까지의 훈련이 필요합니다.`);
  if(totBlank>=2)out.bad.push(`무응답이 ${NUM(totBlank)} 문항입니다. 시간 배분과 풀이 순서 전략을 함께 점검하겠습니다.`);
  if(T.rate<.4)out.bad.push(`현재는 응용보다 <b>기본 개념과 표준 유형의 정착</b>이 우선입니다. 범위를 좁혀 반복하는 방식이 효과적입니다.`);

  /* ---- 과목별 총평 ---- */
  SUBJ.forEach(sb=>{
    const d=det[sb.id], ss=A.subjects.find(x=>x.id===sb.id), cz=zOf(d.sc.got,ss);
    const clsRate=ss.total?ss.mean/ss.total:0;
    const o={id:sb.id,name:sb.name,rate:d.sc.rate,got:d.sc.got,total:d.sc.total,clsRate,good:[],bad:[],next:''};
    o.line=`${fmt(d.sc.got)}/${fmt(d.sc.total)}점 · 득점률 ${pct(d.sc.rate)} (응시자 평균 ${pct(clsRate)})`;
    // 강점과 보완은 서로 겹치지 않게 — 절대 득점률이 낮으면 평균을 앞서도 보완 쪽으로 봅니다
    const strong=d.areas.filter(a=>a.n>=2&&(a.rate>=.75||(a.rate>=.55&&a.rate-a.cls>=.15))).sort((a,b)=>b.rate-a.rate);
    const weak=d.areas.filter(a=>a.n>=2&&!strong.includes(a)&&(a.rate<=.5||a.cls-a.rate>=.15)).sort((a,b)=>a.rate-b.rate);
    const solo0=d.areas.filter(a=>a.n===1&&a.rate===0);

    // 강점
    strong.slice(0,2).forEach(a=>o.good.push(
      `<b>「${esc(a.unit)}」</b> ${a.n}문항에서 배점의 ${pct(a.rate)}를 득점했습니다(응시자 평균 ${pct(a.cls)}). `
      +(a.rate>=.95?'해당 단원은 개념과 계산이 모두 안정적으로 정착된 상태입니다.':'개념 이해가 안정적이며, 이 단원은 심화 문항으로 확장해도 좋습니다.')));
    if(d.hardSolved.length)o.good.push(`정답률 ${pct(Math.max(...d.hardSolved.map(x=>x.qs.rate)))} 이하의 고난도 문항(${d.hardSolved.map(x=>dispNo(x.q)+'번').join(', ')})을 해결했습니다. 복합 조건을 스스로 분해해 내는 사고력이 확인됩니다.`);
    if(!d.easyMiss.length&&d.buckets.easy.length>=3)o.good.push(`다수가 맞힌 기본 문항 ${d.buckets.easy.length}개를 <b>전부 정답</b> 처리했습니다. 아는 문제를 놓치지 않는 정확도가 좋습니다.`);
    if(cz>=.8&&ss.n>3)o.good.push(`${sb.name} 과목만 놓고 보면 응시자 평균을 ${fmt(d.sc.got-ss.mean)}점 앞서며, 이 시험에서 가장 두드러지는 강점 과목입니다.`);
    if(!o.good.length&&d.sc.rate>0){
      const cand=d.areas.filter(a=>!weak.includes(a)&&a.rate>0).sort((a,b)=>b.rate-a.rate)[0];   // 보완으로 지목한 단원은 강점으로 쓰지 않습니다
      o.good.push(cand
        ? `전체적으로 어려운 시험이었음에도 <b>「${esc(cand.unit)}」</b>에서는 득점 흐름이 보입니다(득점률 ${pct(cand.rate)}). 이 부분을 기준점으로 삼아 범위를 넓혀가겠습니다.`
        : `난도가 높은 시험이었지만 끝까지 답안을 작성했습니다. 이번 진단에서 드러난 지점을 하나씩 메우면 충분히 올라갈 수 있습니다.`);
    }

    // 보완
    weak.slice(0,2).forEach(a=>o.bad.push(
      `<b>「${esc(a.unit)}」</b>${jsa(a.unit,'은','는')} ${a.n}문항 중 배점의 ${pct(a.rate)}만 득점했습니다(응시자 평균 ${pct(a.cls)}). `
      +(a.rate>=a.cls?'응시자 평균보다는 앞서지만 절대적인 득점률이 낮아, 이 단원 자체의 난이도가 높았던 것으로 보입니다. 기본 유형부터 다시 다질 필요가 있습니다.'
        :(a.rate<=.25?'개념 정의와 기본 유형부터 다시 세우는 <b>재학습</b>이 필요한 단원입니다.'
          :'개념은 알고 있으나 문제 상황에 적용하는 단계에서 막히고 있어, 유형별 반복 훈련으로 <b>보완</b>이 필요합니다.'))));
    if(d.easyMiss.length)o.bad.push(`정답률이 높았던 기본 문항 ${d.easyMiss.map(x=>dispNo(x.q)+'번').join(', ')}에서 실점했습니다. 난이도에 비해 아까운 실점으로, <b>조건 재확인·검산 루틴</b>을 습관화하면 바로 회복 가능한 점수입니다.`);
    if(d.hardPartial.length)o.bad.push(`고난도 문항 ${d.hardPartial.map(x=>dispNo(x.q)+'번').join(', ')}에서 부분 득점에 그쳤습니다. <b>접근 방향은 옳았으나 완결이 되지 않은</b> 경우로, 풀이를 끝까지 밀어붙이는 연습이 필요합니다.`);
    if(d.hardMiss.length&&d.hardMiss.length===d.buckets.hard.length&&d.buckets.hard.length>=2)o.bad.push(`정답률 40% 미만의 고난도 ${d.buckets.hard.length}문항은 모두 득점하지 못했습니다. 지금 단계에서는 무리한 심화보다 <b>표준 유형의 완성도</b>를 먼저 끌어올리는 편이 효율적입니다.`);
    // 유형별 — 서술형처럼 쓰는 힘이 필요한 문항
    Object.keys(d.types||{}).forEach(t=>{
      const x=d.types[t];if(x.n<2)return;
      const 서술=/서술|논술/.test(t);
      if(x.rate>=.75)o.good.push(`<b>${esc(t)}</b> ${x.n}문항에서 배점의 ${pct(x.rate)}를 확보했습니다. `
        +(서술?'답을 아는 데 그치지 않고 <b>근거를 문장으로 완성</b>하는 힘이 있습니다.':'해당 형식의 문항을 안정적으로 처리합니다.'));
      else if(x.rate<=.4)o.bad.push(`<b>${esc(t)}</b> ${x.n}문항의 득점률이 ${pct(x.rate)}에 그쳤습니다. `
        +(서술?'개념을 알더라도 <b>풀이 과정과 근거를 글로 정리하는 훈련</b>이 별도로 필요합니다. 답만 맞히는 연습으로는 오르지 않는 영역입니다.'
          :'이 형식에 대한 적응 훈련이 필요합니다.'));
    });
    if(d.blanks)o.bad.push(`무응답 ${d.blanks}문항이 있습니다. 부분 점수를 노릴 수 있는 문항까지 손을 대지 못한 것은 아닌지, 시간 운영을 함께 점검하겠습니다.`);
    if(solo0.length)o.bad.push(`<b>「${solo0.map(a=>esc(a.unit)).join('」·「')}」</b> 단원은 출제된 문항을 득점하지 못했습니다. 문항 수가 적어 단정하긴 이르지만, 다음 진단에서 확인이 필요한 지점입니다.`);
    if(!o.bad.length)o.bad.push(`뚜렷한 약점 단원이 드러나지 않았습니다. 현행 수준의 문제로는 변별이 어려우므로, <b>더 높은 난이도</b>에서 다시 진단할 것을 권합니다.`);

    // 다음 학습 제안
    const focus=weak[0]||d.areas.slice().sort((a,b)=>a.rate-b.rate)[0];
    o.next=d.sc.rate>=.8
      ? `심화·서술형 중심 학습 — ${focus?`「${esc(focus.unit)}」`:'전 단원'} 고난도 복합 문항과 풀이 완결성 훈련`
      : (d.sc.rate>=.5
        ? `${focus?`「${esc(focus.unit)}」`:'취약 단원'} 개념 재정리 → 표준 유형 반복 → 기출 응용 순의 3단계 보완`
        : `${focus?`「${esc(focus.unit)}」`:'전 단원'}을 포함한 기본 개념 재정립과 계산 정확도 훈련부터 시작`);
    out.subj.push(o);
  });

  /* ---- 특이사항 ---- */
  if(totEasyMiss>=2&&T.rate>=.65)out.special.push(`실력 수준은 상위 구간이나 <b>기본 문항에서의 실점이 반복</b>되는 유형입니다. 이 시험에서 실수로 잃은 점수만 회복해도 순위가 눈에 띄게 올라갑니다.`);
  if(totPartial>=2&&totHardSolved===0)out.special.push(`고난도 문항에 <b>적극적으로 접근</b>하지만 마무리에서 점수를 놓칩니다. 시도 자체는 좋은 신호이므로, 완결 훈련에 집중하면 성장 폭이 큽니다.`);
  if(gap>=.25)out.special.push(`과목 간 편차가 커 <b>${lo.sb.name} 집중 보완</b>이 필요한 상태입니다. 학습 시간을 재배분할 것을 권합니다.`);
  if(totBlank===0&&T.rate>=.5)out.special.push(`전 문항에 답안을 작성했습니다. 끝까지 시험을 운영하는 태도가 좋습니다.`);
  if(A.roster.length>4&&z>=1.5)out.special.push(`응시자 중 <b>최상위 구간</b>에 해당하는 성적으로, <b>영재학교 대비 심화 과정</b> 편성이 적합합니다.`);
  if(A.roster.length>4&&z<=-1.2)out.special.push(`현 시점의 격차를 고려할 때, 진도보다 <b>개념 기반을 다지는 과정</b>부터 시작하는 편이 장기적으로 유리합니다.`);
  const st_memo=(st.memo||'').trim();
  if(st_memo)out.special.push(esc(st_memo));
  if(!out.special.length)out.special.push(`특별히 기록할 이상 신호는 없습니다. 현재 학습 방향을 유지하며 취약 단원만 보완하면 됩니다.`);
  if(!out.good.length)out.good.push(`끝까지 답안을 작성하며 시험을 완주했습니다. 이번 진단 결과를 기준점으로 삼아 학습 계획을 세우겠습니다.`);
  if(!out.bad.length)out.bad.push(`현 난이도에서는 뚜렷한 약점이 확인되지 않습니다. 상위 난이도에서 재진단할 것을 권합니다.`);
  return out;
}
/* 사용자 편집 반영 */
function commentsFor(st,A){
  const c=genComments(st,A), e=S.edits[st.id]||{};
  const ln=s=>String(s).split('\n').map(x=>x.trim()).filter(Boolean);
  if(e.lead)c.lead=e.lead;
  if(e.og!==undefined)c.good=ln(e.og);
  if(e.ob!==undefined)c.bad=ln(e.ob);
  if(e.sp!==undefined)c.special=ln(e.sp);
  c.subj.forEach(o=>{
    const es=(e.subj||{})[o.id]||{};
    if(es.g!==undefined)o.good=ln(es.g);
    if(es.b!==undefined)o.bad=ln(es.b);
    if(es.n!==undefined)o.next=es.n;
  });
  return c;
}

function delExam(){
  const e=E(), ps=papersOf(e), n=ps.reduce((a,p)=>a+roster(p).length,0);

function doImportPaperForm(){
  const cur=P(),src=S.papers.find(p=>p.id===$('ip_src').value);
  const mode=document.querySelector('input[name=ipmode]:checked').value;
  if(!src)return;
  if(mode==='all'){
    if(roster(cur).length&&!confirm('현재 시험지의 문항 구성이 교체됩니다. 이미 입력한 채점 결과는 문항이 달라지면 맞지 않을 수 있습니다. 계속할까요?'))return;
    cur.subjects=cloneSubjects(src.subjects);cur.view=src.view;cur.cols=Object.assign({},src.cols);
  }else{
    cur.subjects.forEach((sb,i)=>{
      const s2=src.subjects.find(x=>x.name===sb.name)||src.subjects[i];
      if(!s2)return;
      if(mode==='meta')sb.units=s2.units.slice();
      sb.questions.forEach(q=>{
        const q2=s2.questions.find(x=>x.n===q.n);if(!q2)return;
        if(mode==='pt')q.pt=q2.pt;
        else{q.unit=q2.unit;q.topic=q2.topic;q.sub=q2.sub;q.type=q2.type;q.diff=q2.diff}
      });
    });
  }
  save();closeModal();render();
  toast(({all:'전체 구성을 가져왔습니다',meta:'단원·평가 요소를 가져왔습니다',pt:'배점을 가져왔습니다'})[mode]);
}

/* ---------- 표 붙여넣기 (엑셀·한글·웹 표를 그대로 복사해 문항 구성 만들기) ---------- */
function pasteTable(){
  modal(`<h3>표 붙여넣기 — 「${esc(P().name)}」 문항 구성</h3><div class="mbody">
    <p class="muted" style="margin-top:0">엑셀·한글·웹 페이지의 표를 그대로 복사해서 아래에 붙여넣으세요.
      <b>대분류(과목)가 바뀌면 과목이 나뉘고</b>, 문항 번호·배점·단원·문항분석·난이도가 한 번에 채워집니다.</p>
    <div class="muted" style="background:#fafbfc;border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:10px;line-height:1.8">
      인식하는 열 이름 — <b>문항번호 · 대분류 · 세부과목 · 문항유형 · 대단원 · 문항분석 · 난이도 · 배점</b><br>
      문항분석이 <b>[서술형]</b> 처럼 시작하면 그 부분을 <b>문항 유형</b>으로 자동 분리합니다.<br>
      첫 줄에 열 이름이 없으면 <b>위 순서 그대로</b>라고 봅니다. 난이도는 ${DIFFS.join(' / ')} 중 하나이며, 비우면 정답률로 자동 산출합니다.
    </div>
    <textarea id="ptTa" rows="10" placeholder="문항번호	대분류	세부과목	대단원	문항분석	난이도	배점
1	물리	물1	역학	물리학 용어를 정확하게 숙지하고 있는지 확인	하	4"></textarea>
    <div id="ptPre" class="muted" style="margin-top:8px"></div>
  </div><div class="foot">
    <button class="btn" onclick="closeModal()">취소</button>
    <button class="btn p" onclick="doPasteTable()">이 시험지에 적용</button></div>`);
  const ta=$('ptTa');
  ta.addEventListener('input',()=>{
    const r=parseTable(ta.value);
    $('ptPre').innerHTML=r.subjects.length
      ? `인식 결과 — ${r.subjects.map(sb=>`<b>${esc(sb.name)}</b> ${sb.questions.length}문항 · ${fmt(subjTotal(sb))}점`).join(' &nbsp;/&nbsp; ')}
         &nbsp;→ 합계 <b>${r.subjects.reduce((a,sb)=>a+sb.questions.length,0)}문항 · ${fmt(r.subjects.reduce((a,sb)=>a+subjTotal(sb),0))}점</b>`
      : '<span style="color:var(--bad)">아직 표를 인식하지 못했습니다 — 표를 통째로 복사해 붙여넣어 주세요.</span>';
  });
  setTimeout(()=>ta.focus(),50);
}
function parseTable(text){
  const lines=String(text||'').split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim());
  if(!lines.length)return {subjects:[]};
  let rows=lines.map(l=>(l.includes('\t')?l.split('\t'):l.split(/ {2,}|\s*\|\s*/)).map(c=>c.trim()));
  const H=rows[0]||[];
  let idx={no:0,cat:1,sub:2,type:-1,unit:3,topic:4,diff:5,pt:6};
  if(H.some(c=>/문항\s*번호|대분류|단원|난이도|배점|분석/.test(c))){
    const used=new Set();
    const f=re=>{const i=H.findIndex((c,j)=>!used.has(j)&&re.test(c));if(i>=0)used.add(i);return i};
    idx={no:f(/번호/),sub:f(/세부\s*과목|소분류/),type:f(/유형|형식|문항\s*형태/),cat:f(/대분류|과목|영역/),unit:f(/단원/),
         topic:f(/분석|평가\s*요소|내용|설명|출제/),diff:f(/난이도/),pt:f(/배점|점수|점$/)};
    rows.shift();
  }
  const g=(r,i)=>i>=0&&i<r.length?(r[i]||'').trim():'';
  const groups=[];
  rows.forEach(r=>{
    if(!r.length||!r.join('').trim())return;
    let topic=g(r,idx.topic); const no=parseInt(g(r,idx.no)), pt=parseFloat(g(r,idx.pt));
    let type=g(r,idx.type);
    const pre=topic.match(/^\[([^\]]{1,8})\]\s*/);          // "[서술형] …" 같은 접두어를 유형으로 옮깁니다
    if(pre&&!type){type=pre[1];topic=topic.slice(pre[0].length)}
    if(!topic&&!g(r,idx.unit)&&isNaN(pt))return;                     // 빈 줄·머리글 잔여물
    const cat=g(r,idx.cat)||'기타';
    let gr=groups.find(x=>x.name===cat);
    if(!gr)groups.push(gr={name:cat,questions:[]});
    let d=g(r,idx.diff).replace(/\s/g,'');
    if(!DIFFS.includes(d))d='';
    gr.questions.push({n:gr.questions.length+1,no:isNaN(no)?0:no,pt:isNaN(pt)?0:pt,
      unit:g(r,idx.unit),topic,sub:g(r,idx.sub),type,diff:d});
  });
  return {subjects:groups.map(gr=>({id:uid(),name:gr.name,
    units:[...new Set(gr.questions.map(q=>q.unit).filter(Boolean))],questions:gr.questions}))};
}
function doPasteTable(){
  const r=parseTable($('ptTa').value);
  if(!r.subjects.length)return toast('표를 인식하지 못했습니다');
  const cur=P(), n=roster(cur).length;
  if(n&&!confirm(`「${cur.name}」의 문항 구성이 교체됩니다. 이미 입력한 응시자 ${n}명의 채점 결과는 문항이 달라지면 맞지 않을 수 있습니다. 계속할까요?`))return;
  cur.subjects=r.subjects;
  cur.cols=Object.assign({},DEF_COLS,cur.cols||{});
  if(r.subjects.some(sb=>sb.questions.some(q=>q.sub)))cur.cols.sub=true;
  if(r.subjects.some(sb=>sb.questions.some(q=>q.type)))cur.cols.type=true;
  // 문항 번호가 과목별로 뭉쳐 있지 않으면(물화 혼합) 문항 순서 보기로 전환합니다
  const seq=r.subjects.flatMap(sb=>sb.questions.map(q=>({name:sb.name,no:dispNo(q)}))).sort((a,b)=>a.no-b.no);
  let switches=0;for(let i=1;i<seq.length;i++)if(seq[i].name!==seq[i-1].name)switches++;
  if(r.subjects.length>1&&switches>=r.subjects.length){cur.view='flat';cur.cols.subject=true}
  save();closeModal();render();
  toast(`${r.subjects.length}개 과목 · ${r.subjects.reduce((a,sb)=>a+sb.questions.length,0)}문항을 채웠습니다`);
}

/* ---------- 문항 목록·칼럼 설정 공통 ---------- */
const SUB_PRESET={'물리':['중등','물1','물2'],'화학':['중등','화1','화2'],'생명과학':['중등','생1','생2'],
  '지구과학':['중등','지1','지2'],'수학':['중등','수(상)','수(하)','수1','수2','미적분','기하','확통']};
function subOptions(sb){
  const used=[...new Set(sb.questions.map(q=>(q.sub||'').trim()).filter(Boolean))];
  return [...new Set([...used,...(SUB_PRESET[sb.name]||['중등'])])];
}
/* 시험지의 모든 문항을 표기 번호 순으로 (과목이 섞인 시험지용) */
function allQuestions(p){
  p=p||P();const out=[];
  p.subjects.forEach((sb,si)=>sb.questions.forEach((q,qi)=>out.push({sb,q,si,qi})));
  return out.sort((a,b)=>(dispNo(a.q)-dispNo(b.q))||(a.si-b.si));
}
const COLDEF=[['subject','과목'],['sub','세부과목'],['type','문항 유형'],['unit','평가 단원'],['topic','세부 평가 요소'],
  ['pt','배점'],['mean','문항 평균'],['rate','정답률'],['diff','난이도']];
function colOn(k,p){return !!(((p||P()).cols)||DEF_COLS)[k]}
function colsModal(){

    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)">

        onchange="P().view='subject';save();render()"> <span style="font-size:13px"><b>과목별로 나눠서</b> — 물리 표, 화학 표를 따로 인쇄</span></label>

/* ---------- 문항 단위 편집 (과목 이동·추가·삭제) ---------- */
function nextNo(p){return Math.max(0,...allQuestions(p).map(x=>dispNo(x.q)))+1}
function findQ(qid){                       // qid = "subjectId:n"
  const p=P(),[sid,n]=qid.split(':');
  const sb=p.subjects.find(x=>x.id===sid);
  return {p,sb,q:sb&&sb.questions.find(x=>x.n===Number(n))};
}
function setQField(qid,field,val){
  const {q}=findQ(qid);if(!q)return;
  q[field]=field==='pt'?(Number(val)||0):(field==='no'?(parseInt(val)||0):val);
  save();
}
function moveQSubject(qid,name){
  name=(name||'').trim();if(!name)return render();
  const {p,sb,q}=findQ(qid);if(!q||sb.name===name)return;
  let tg=p.subjects.find(x=>x.name===name);
  if(!tg){tg={id:uid(),name,units:[],questions:[]};p.subjects.push(tg)}
  const oldKey=qkey(sb.id,q.n);
  const nq=Object.assign({},q,{n:Math.max(0,...tg.questions.map(x=>x.n))+1});
  if(!nq.no)nq.no=q.n;                                   // 표기 번호는 그대로 유지
  tg.questions.push(nq);
  sb.questions=sb.questions.filter(x=>x!==q);
  roster(p).forEach(st=>{                                // 채점 결과도 함께 옮깁니다
    const v=st.marks[oldKey];
    if(v!==undefined){st.marks[qkey(tg.id,nq.n)]=v;delete st.marks[oldKey]}
  });
  p.subjects=p.subjects.filter(x=>x.questions.length);
  save();render();
}
function addQuestionFlat(){
  const p=P();
  const last=allQuestions(p).at(-1);
  const sb=last?last.sb:(p.subjects[0]||(p.subjects.push({id:uid(),name:'과목',units:[],questions:[]}),p.subjects[0]));
  sb.questions.push({n:Math.max(0,...sb.questions.map(x=>x.n))+1,no:nextNo(p),
    pt:last?last.q.pt:5,unit:last?last.q.unit:'',topic:'',sub:last?last.q.sub:'',type:last?last.q.type:'',diff:''});
  save();render();
}
function delQuestion(qid){
  const {p,sb,q}=findQ(qid);if(!q)return;
  if(!confirm(`${dispNo(q)}번 문항(${sb.name})을 삭제할까요? 이 문항의 채점 결과도 함께 지워집니다.`))return;
  const k=qkey(sb.id,q.n);
  roster(p).forEach(st=>delete st.marks[k]);
  sb.questions=sb.questions.filter(x=>x!==q);
  p.subjects=p.subjects.filter(x=>x.questions.length);
  if(!p.subjects.length)p.subjects=[blankSubject('과목')];
  save();render();
}
function renumberFlat(){
  const p=P();
  if(!confirm('표시된 순서대로 문항 번호를 1번부터 다시 매길까요?'))return;
  allQuestions(p).forEach((x,i)=>x.q.no=i+1);
  save();render();toast('문항 번호를 다시 매겼습니다');
}

function setQCount(si,v){
  const n=clamp(parseInt(v)||1,1,60), sb=P().subjects[si], cur=sb.questions.length;
  if(n>cur)for(let i=cur;i<n;i++)sb.questions.push({n:i+1,no:0,pt:sb.questions.at(-1)?.pt||10,unit:'',topic:'',sub:'',type:'',diff:''});
  else sb.questions=sb.questions.slice(0,n);
  sb.questions.forEach((q,i)=>q.n=i+1);save();render();
}
function bulkPt(si){
  const v=prompt('모든 문항에 적용할 배점을 입력하세요',String(P().subjects[si].questions[0]?.pt||10));
  if(v===null)return;const n=Number(v);if(isNaN(n))return toast('숫자를 입력해 주세요');
  P().subjects[si].questions.forEach(q=>q.pt=n);save();render();toast('배점을 일괄 적용했습니다');
}
function editUnits(si){
  const sb=P().subjects[si];
  modal(`<h3>${esc(sb.name)} — 단원 목록</h3><div class="mbody">
    <p class="muted" style="margin-top:0">한 줄에 하나씩 입력하세요. 문항 설정에서 자동완성으로 뜹니다.</p>
    <textarea id="unitsTa" rows="8">${esc(sb.units.join('\n'))}</textarea>
    <div class="row" style="margin-top:10px">${Object.keys(UNIT_PRESET).map(k=>`<button class="btn sm" onclick="$('unitsTa').value=${JSON.stringify(UNIT_PRESET[k].join('\n'))}">${k} 기본값</button>`).join('')}</div>
  </div><div class="foot"><button class="btn" onclick="closeModal()">취소</button>
    <button class="btn p" onclick="P().subjects[${si}].units=$('unitsTa').value.split('\\n').map(s=>s.trim()).filter(Boolean);save();closeModal();render()">저장</button></div>`);
}
function addSubject(){
  const n=prompt('과목명을 입력하세요 (물리 / 화학 / 수학 / 생명과학 / 지구과학 은 기본 단원이 자동 입력됩니다)','수학');
  if(!n)return;P().subjects.push(blankSubject(n.trim()));save();render();
}
function delSubject(si){
  if(!confirm(`${P().subjects[si].name} 과목과 해당 성적을 모두 삭제할까요?`))return;
  const sid=P().subjects[si].id;
  roster().forEach(st=>Object.keys(st.marks).forEach(k=>{if(k.startsWith(sid+':'))delete st.marks[k]}));
  P().subjects.splice(si,1);save();render();
}

/* ---------- ③ 성적 입력 ---------- */
let IMODE=LS.get('rcard.imode')||'mark';
let ROWS=[];                                  // 현재 시험지의 응시자 (그리드 행 순서)
function renderScores(){
  const PP=P();
  ROWS=roster(PP);
  // 열은 언제나 문항 번호 순 — 물리·화학이 섞인 시험지도 시험지 그대로 입력합니다

  const runs=[];                                  // 같은 과목이 연속된 구간끼리 머리글을 묶습니다
  cols.forEach(c=>{const last=runs[runs.length-1];
    if(last&&last.sb.id===c.sb.id)last.n++;else runs.push({sb:c.sb,n:1})});
  const head1=runs.map(r=>{
    const whole=r.n===r.sb.questions.length;      // 과목 전체가 한 구간이면 배점도 함께
    return `<th class="sub" colspan="${r.n}">${esc(r.sb.name)}${whole?` <span style="font-weight:500;opacity:.7">${fmt(subjTotal(r.sb))}점</span>`:''}</th>`;
  }).join('');
  const head2=cols.map(c=>`<th title="${esc(c.sb.name)} ${dispNo(c.q)}번 · ${fmt(c.q.pt)}점 ${esc(c.q.sub||'')} ${esc(c.q.unit)}">${dispNo(c.q)}</th>`).join('');
  const body=ROWS.map((st,i)=>{
    const T=studentTotal(st);
    return `<tr class="${st.dummy?'dm':''}">
      <td class="stick"><span onclick="editStudent(${i})" style="cursor:pointer">${esc(st.name)||'<i class="muted">이름 없음</i>'}</span>
        ${st.dummy?'<span class="pill b" style="margin-left:4px">더미</span>':`<span class="muted" style="font-weight:400"> ${esc(st.school||'')}</span>`}</td>

function setMode(m){IMODE=m;LS.set('rcard.imode',m);render()}
function cellCycle(btn){
  const i=+btn.dataset.r,k=btn.dataset.k,cur=ROWS[i].marks[k];
  const order=[undefined,'O','T','X'];let idx=order.indexOf(cur);if(idx<0)idx=0;
  applyMark(i,k,order[(idx+1)%4],btn);
}
function applyMark(i,k,v,btn){
  if(v===undefined||v===null||v==='')delete ROWS[i].marks[k];else ROWS[i].marks[k]=v;
  save();
  if(btn){btn.className='mkc '+(v||'');btn.textContent=MARKS[v]||'·'}
  const t=$('tot'+i);if(t)t.textContent=fmt(studentTotal(ROWS[i]).got);
}
function cellNum(inp){
  const i=+inp.dataset.r,k=inp.dataset.k,v=inp.value.trim();
  if(v==='')delete ROWS[i].marks[k];else ROWS[i].marks[k]=Number(v);
  save();const t=$('tot'+i);if(t)t.textContent=fmt(studentTotal(ROWS[i]).got);
}
function bindGridKeys(){
  const tb=$('mkTable');if(!tb)return;
  tb.addEventListener('keydown',e=>{
    const el=e.target;if(!el.dataset||el.dataset.r===undefined)return;
    const cells=[...tb.querySelectorAll('[data-k]')],idx=cells.indexOf(el);
    const perRow=cells.length/Math.max(1,ROWS.length);
    const mv=d=>{const n=cells[idx+d];if(n){n.focus();if(n.select)n.select();e.preventDefault()}};
    if(e.key==='ArrowRight')return mv(1);
    if(e.key==='ArrowLeft')return mv(-1);
    if(e.key==='ArrowDown'||e.key==='Enter')return mv(perRow);
    if(e.key==='ArrowUp')return mv(-perRow);
    if(el.classList.contains('mkc')){
      const map={'1':'O','o':'O','O':'O','2':'T','t':'T','T':'T','3':'X','x':'X','X':'X','0':undefined,'Backspace':undefined,'Delete':undefined,' ':'O'};
      if(e.key in map){applyMark(+el.dataset.r,el.dataset.k,map[e.key],el);e.preventDefault();
        const n=cells[idx+1];if(n&&e.key!==' ')n.focus();}
    }
  });
}

      성적표 발행 대상에서는 기본으로 빠집니다. 언제든 한 번에 지울 수 있습니다.</p>`
    :`<p style="color:var(--bad)">실제 학생이 한 명도 없습니다. 기준이 될 최고점이 없으므로 먼저 실제 성적을 입력해 주세요.</p>`}
  </div><div class="foot">
    ${dum.length?`<button class="btn dg" onclick="clearDummies()">더미 ${dum.length}명 모두 삭제</button>`:''}
    <span style="flex:1"></span>
    <button class="btn" onclick="closeModal()">닫기</button>
    ${real.length?`<button class="btn p" onclick="doAddDummies()">추가</button>`:''}</div>`);
}
function doAddDummies(){
  const n=clamp(parseInt($('dmN').value)||0,1,200), band=$('dmBand').value;
  const p=P(), real=roster(p).filter(s=>!s.dummy);
  const cap=Math.max(...real.map(s=>studentTotal(s).got));
  const lo={wide:.25,mid:.40,tight:.55}[band], hi={wide:1,mid:.95,tight:.90}[band];
  const qs=[];p.subjects.forEach(sb=>sb.questions.forEach(q=>qs.push({sb,q})));
  const totalPt=grandTotal(p);
  const base=roster(p).filter(s=>s.dummy).length;      // 이름 번호는 시작 시점 기준으로 한 번만 셉니다
  let made=0;
  for(let i=0;i<n;i++){
    const target=Math.min(cap,Math.round(cap*(lo+Math.random()*(hi-lo))));
    const ability=totalPt?target/totalPt:0;
    const st={id:uid(),paperId:p.id,dummy:true,
      name:`더미 ${String(base+i+1).padStart(2,'0')}`,
      school:'',grade:'',phone:'',memo:'',marks:{}};
    qs.forEach(c=>{
      const r=clamp(ability+(Math.random()-.5)*.55,0,1);
      const v=Math.round(r*c.q.pt);
      st.marks[qkey(c.sb.id,c.q.n)]=v>=c.q.pt?'O':(v<=0?'X':v);
    });
    // 실제 최고점을 넘지 않도록 무작위 문항에서 점수를 덜어냅니다
    let guard=0;
    while(studentTotal(st).got>target&&guard++<600){
      const c=qs[Math.floor(Math.random()*qs.length)];
      const k=qkey(c.sb.id,c.q.n), cur=qScore(c.q,st.marks[k]);
      if(cur===null||cur<=0)continue;
      const nv=Math.max(0,cur-1);
      st.marks[k]=nv>=c.q.pt?'O':(nv<=0?'X':nv);
    }
    S.students.push(st);made++;
  }
  save();closeModal();render();
  toast(`더미 ${made}명을 추가했습니다 (최고 ${fmt(Math.max(...roster().filter(s=>s.dummy).map(s=>studentTotal(s).got)))}점 · 실제 최고 ${fmt(cap)}점)`);
}
function clearDummies(){
  const p=P(),n=roster(p).filter(s=>s.dummy).length;
  if(!confirm(`「${p.name}」의 더미 ${n}명을 삭제할까요? 실제 학생은 그대로 남습니다.`))return;
  S.students=S.students.filter(s=>!(s.paperId===p.id&&s.dummy));
  save();closeModal();render();toast('더미 데이터를 삭제했습니다');
}

  </div><div class="foot">

  setTimeout(()=>$('psTa').focus(),50);
  psPreview();
}
const isNum=v=>v!==''&&v!=null&&!isNaN(Number(v));
function transformNums(raw,merges,skip){
  const used=new Set(),out=[];
  for(let i=1;i<=raw.length;i++){
    if(used.has(i)||skip.has(i))continue;
    const g=merges.find(m=>m.includes(i));
    if(g){
      g.forEach(k=>used.add(k));
      const vals=g.map(k=>raw[k-1]);
      out.push(vals.every(v=>v===null||v===undefined)?null:vals.reduce((a,v)=>a+(v||0),0));
    }else out.push(raw[i-1]);
  }
  return out;
}
function parseScoreRows(text,skip,merges){
  merges=merges||[];
  const rows=String(text||'').split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim())
    .map(l=>(l.includes('\t')?l.split('\t'):l.split(/ {2,}|\s*\|\s*/)).map(c=>c.trim()));
  const out=[];
  rows.forEach(r=>{
    const first=r.findIndex(c=>isNum(c));
    if(first<0)return;                                     // 숫자가 없는 줄(머리글 등)은 건너뜁니다
    let last=r.length-1;while(last>first&&!isNum(r[last]))last--;
    const texts=r.slice(0,first).map(c=>c.trim()).filter(Boolean);
    if(!texts.length)return;                               // 이름이 없는 줄
    let nums=r.slice(first,last+1).map(c=>isNum(c)?Number(c):null);   // 빈칸·기호는 무응답
    nums=transformNums(nums,merges,skip);
    const phone=texts.find(t=>/^01[016789][-. ]?\d{3,4}[-. ]?\d{4}$/.test(t.replace(/\s/g,'')))||'';
    const rest=texts.filter(t=>t!==phone);
    out.push({name:rest[0]||texts[0],school:rest[1]||'',phone,nums});
  });
  return out;
}
function skipSet(){
  return new Set(String($('psSkip')?.value||'').split(/[,\s]+/).map(x=>parseInt(x)).filter(n=>n>0));
}
function mergeList(){
  return String($('psMerge')?.value||'').split(',').map(g=>g.split('+').map(x=>parseInt(x)).filter(n=>n>0))
    .filter(g=>g.length>1);
}
function psPreview(){
  const list=parseScoreRows($('psTa').value,skipSet(),mergeList()), el=$('psPre'), btn=$('psGo');
  const qs=[];P().subjects.forEach(sb=>sb.questions.forEach(q=>qs.push({sb,q})));
  if(!list.length){el.innerHTML='<span class="muted">아직 표를 인식하지 못했습니다.</span>';btn.disabled=true;return}
  const counts=[...new Set(list.map(r=>r.nums.length))];
  const ok=counts.length===1&&counts[0]===qs.length;
  btn.disabled=!ok;
  const s=list[0];
  el.innerHTML=`<div style="border:1px solid ${ok?'var(--line)':'#f5c6c2'};background:${ok?'#fafbfc':'var(--badbg)'};border-radius:7px;padding:10px 12px">
    <div style="font-size:13px;font-weight:700;margin-bottom:5px">${ok?'✓':'⚠'} 학생 ${list.length}명 · 점수 칸 ${counts.join('/')}개 · 이 시험지 문항 ${qs.length}개</div>
    ${ok?`${(()=>{                                     // 배점을 넘는 점수 = 열이 밀렸다는 신호
        const bad=[];
        list.forEach(r=>r.nums.forEach((v,i)=>{if(v!==null&&v>qs[i].q.pt)bad.push(`${esc(r.name)} ${qs[i].sb.name}${dispNo(qs[i].q)}번 ${v}점(배점 ${qs[i].q.pt})`)}));
        return bad.length?`<div style="color:var(--bad);font-size:12.5px;margin-bottom:6px">⚠ 배점보다 큰 점수가 ${bad.length}개 있습니다 — 열이 한 칸씩 밀렸을 수 있습니다.<br>${bad.slice(0,3).join(' / ')}${bad.length>3?' …':''}</div>`:'';
      })()}<div class="muted">첫 줄 확인 — <b>${esc(s.name)}</b>${s.school?` (${esc(s.school)})`:''}${s.phone?` · ${esc(s.phone)}`:''}<br>
      ${qs.map((c,i)=>`${esc(c.sb.name)}${dispNo(c.q)}=<b>${s.nums[i]===null?'·':s.nums[i]}</b>`).slice(0,8).join(' &nbsp; ')} …
      &nbsp; 합계 <b>${fmt(s.nums.reduce((a,v,i)=>a+Math.min(v===null?0:v,qs[i].q.pt),0))}점</b> / ${fmt(grandTotal())}점</div>`
    :`<div style="color:var(--bad);font-size:12.5px">점수 칸 수와 문항 수가 맞지 않습니다.
       ${counts.length>1?'줄마다 칸 수가 다릅니다 — 복사 범위를 확인해 주세요.'
        :(counts[0]>qs.length?`칸이 ${counts[0]-qs.length}개 많습니다 — 한 문항이 소문항으로 쪼개져 있으면 <b>합칠 칸</b>에, 소계 같은 칸이면 <b>무시할 칸</b>에 적어 주세요.`
         :`칸이 ${qs.length-counts[0]}개 모자랍니다 — 복사 범위나 시험지 문항 수를 확인해 주세요.`)}<br>
       참고 — 이 시험지 문항 순서: ${P().subjects.map(sb=>`${esc(sb.name)} ${sb.questions.length}문항`).join(' → ')}</div>`}
  </div>`;
}
function doPasteScores(){
  const list=parseScoreRows($('psTa').value,skipSet(),mergeList());
  const qs=[];P().subjects.forEach(sb=>sb.questions.forEach(q=>qs.push({sb,q})));
  if(!list.length||list.some(r=>r.nums.length!==qs.length))return toast('점수 칸 수가 문항 수와 맞지 않습니다');
  let add=0,upd=0;
  list.forEach(r=>{
    let st=roster().find(s=>s.name===r.name);
    if(!st){st={id:uid(),paperId:P().id,name:r.name,school:r.school,phone:r.phone,grade:P().target||E().target||'',memo:'',marks:{}};S.students.push(st);add++}
    else{upd++;if(r.school)st.school=r.school;if(r.phone)st.phone=r.phone}
    qs.forEach((c,i)=>{
      const k=qkey(c.sb.id,c.q.n), v=r.nums[i];
      if(v===null)delete st.marks[k];
      else st.marks[k]=clamp(v,0,c.q.pt)>=c.q.pt?'O':(v<=0?'X':clamp(v,0,c.q.pt));
    });
  });
  save();closeModal();render();toast(`입력 완료 — 신규 ${add}명, 갱신 ${upd}명 · 각 ${qs.length}문항`);
}

function doAddStudents(){
  const lines=$('stTa').value.split('\n').map(s=>s.trim()).filter(Boolean);
  let n=0;
  lines.forEach(l=>{
    const p=l.split(/[\t,]/).map(s=>s.trim());
    if(!p[0])return;
    S.students.push({id:uid(),paperId:P().id,name:p[0],school:p[1]||'',grade:p[2]||P().target||E().target||'',memo:'',marks:{}});n++;
  });
  save();closeModal();render();toast(n+'명을 추가했습니다');
}

function saveStudent(i){
  const st=ROWS[i], np=$('e_paper')?$('e_paper').value:st.paperId;
  if(np!==st.paperId){
    if(!confirm('시험지를 옮기면 이 학생의 채점 결과가 초기화됩니다. 계속할까요?'))return;
    st.paperId=np;st.marks={};delete S.edits[st.id];
  }
  st.name=$('e_name').value.trim();st.school=$('e_school').value.trim();
  st.grade=$('e_grade').value.trim();st.memo=$('e_memo').value.trim();
  if($('e_phone'))st.phone=$('e_phone').value.trim();
  save();closeModal();render();
}
function delStudent(i){
  if(!confirm(`${ROWS[i].name} 학생을 삭제할까요?`))return;
  S.students=S.students.filter(x=>x.id!==ROWS[i].id);save();closeModal();render();
}

/* ---------- 엑셀 ---------- */
const libs={};
function loadLib(url,test){
  return new Promise((res,rej)=>{
    if(test&&test())return res();
    if(libs[url])return libs[url].then(res,rej);
    libs[url]=new Promise((ok,ng)=>{
      const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>ng(new Error('load fail'));document.head.appendChild(s);
    });
    libs[url].then(res,rej);
  });
}
const XLSX_CDN='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
function colName(sb,q){return sb.name+dispNo(q)}
async function xlsxTemplate(){
  try{
    await loadLib(XLSX_CDN,()=>window.XLSX);
    const head=['이름','학교','학년','메모'];
    P().subjects.forEach(sb=>sb.questions.forEach(q=>head.push(colName(sb,q))));
    const pts=['배점','','',''];P().subjects.forEach(sb=>sb.questions.forEach(q=>pts.push(q.pt)));
    const rows=[head,pts];
    (roster().length?roster():[{name:'홍길동',school:'○○중',grade:'중3',memo:'',marks:{}}]).forEach(st=>{
      const r=[st.name,st.school||'',st.grade||'',st.memo||''];
      P().subjects.forEach(sb=>sb.questions.forEach(q=>{const v=st.marks[qkey(sb.id,q.n)];r.push(v===undefined?'':v)}));
      rows.push(r);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
    ws['!cols']=head.map((h,i)=>({wch:i<4?12:5}));
    XLSX.utils.book_append_sheet(wb,ws,'성적입력');
    XLSX.writeFile(wb,`${E().examName||'시험'}_${P().name}_성적입력양식.xlsx`);
    toast('엑셀 양식을 내려받았습니다 (2행 배점은 참고용, 지워도 됩니다)');
  }catch(e){toast('엑셀 기능을 불러오지 못했습니다 — 인터넷 연결을 확인해 주세요')}
}
function parseMark(v,pt){
  if(v===undefined||v===null||v==='')return undefined;
  const s=String(v).trim();
  const n=Number(s);                                   // 숫자는 항상 '획득 점수'로 해석
  if(!isNaN(n))return n>=pt?'O':(n<=0?'X':n);
  if(/^(o|O|ㅇ|○|◯|정답|맞음)$/.test(s))return 'O';
  if(/^(△|▲|세모|t|T|부분)$/.test(s))return 'T';
  if(/^(x|X|ㅌ|×|✕|오답|틀림)$/.test(s))return 'X';
  return undefined;
}
async function xlsxImport(inp){
  const f=inp.files[0];if(!f)return;inp.value='';
  try{
    await loadLib(XLSX_CDN,()=>window.XLSX);
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!aoa.length)return toast('빈 파일입니다');
    const head=aoa[0].map(h=>String(h).trim());
    const iName=head.findIndex(h=>/이름|성명|name/i.test(h));
    if(iName<0)return toast('첫 행에 "이름" 열이 필요합니다');
    const iSch=head.findIndex(h=>/학교|school/i.test(h)),iGr=head.findIndex(h=>/학년|grade/i.test(h)),iMemo=head.findIndex(h=>/메모|특이/i.test(h));
    // 열 → 문항 매핑
    const map=[];
    head.forEach((h,ci)=>{
      const m=h.match(/^(.*?)\s*(\d+)\s*(번)?$/);if(!m)return;
      const nm=m[1].trim(),no=+m[2];
      const SUBJ=P().subjects;
      let sb=SUBJ.find(x=>x.name===nm)||(SUBJ.length===1&&!nm?SUBJ[0]:null);
      if(!sb&&nm)sb=SUBJ.find(x=>x.name.startsWith(nm)||nm.startsWith(x.name));
      if(!sb)return;
      const q=sb.questions.find(q=>dispNo(q)===no);if(!q)return;
      map.push({ci,sb,q});
    });
    if(!map.length)return toast('문항 열을 찾지 못했습니다. 열 이름을 "물리1", "화학3" 형식으로 맞춰 주세요');
    let added=0,updated=0;
    aoa.slice(1).forEach(r=>{
      const name=String(r[iName]??'').trim();
      if(!name||name==='배점')return;
      let st=roster().find(s=>s.name===name);          // 같은 시험지 안에서만 이름을 맞춥니다
      if(!st){st={id:uid(),paperId:P().id,name,school:'',grade:'',memo:'',marks:{}};S.students.push(st);added++}else updated++;
      if(iSch>=0&&r[iSch])st.school=String(r[iSch]).trim();
      if(iGr>=0&&r[iGr])st.grade=String(r[iGr]).trim();
      if(iMemo>=0&&r[iMemo])st.memo=String(r[iMemo]).trim();
      map.forEach(m=>{
        const v=parseMark(r[m.ci],m.q.pt);
        if(v===undefined)delete st.marks[qkey(m.sb.id,m.q.n)];
        else st.marks[qkey(m.sb.id,m.q.n)]=v;
      });
    });
    save();render();toast(`「${P().name}」 가져오기 완료 — 신규 ${added}명, 갱신 ${updated}명 · ${map.length}개 문항 열 인식`);
  }catch(e){console.error(e);toast('파일을 읽지 못했습니다: '+e.message)}
}

/* ---------- ④ 분석 ---------- */
function histBins(vals,total,bins=10){
  const arr=Array.from({length:bins},(_,i)=>({from:total*i/bins,to:total*(i+1)/bins,c:0}));
  vals.forEach(v=>{let i=Math.floor(v/total*bins);if(i>=bins)i=bins-1;if(i<0)i=0;arr[i].c++});
  return arr;
}
function histSVG(vals,total,mine,opt={}){
  const W=opt.w||420,H=opt.h||96,bins=opt.bins||10,pad=opt.pad||16;
  const b=histBins(vals,total,bins),max=Math.max(1,...b.map(x=>x.c));
  const bw=(W-pad*2)/bins;
  const bars=b.map((x,i)=>{
    const h=(H-26)*(x.c/max),y=H-18-h,mineIn=mine!==undefined&&mine>=x.from&&(mine<x.to||(i===bins-1&&mine<=x.to));
    return `<g><rect x="${pad+i*bw+1.5}" y="${y}" width="${bw-3}" height="${Math.max(h,1)}" rx="2" fill="${mineIn?'#a9843f':'#c9d2dd'}"/>`
      +((x.c&&opt.counts!==false)?`<text x="${pad+i*bw+bw/2}" y="${y-3}" text-anchor="middle" font-size="7" fill="${mineIn?'#a9843f':'#98a2b3'}" font-weight="700">${x.c}</text>`:'')
      +`<text x="${pad+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="6.5" fill="#98a2b3">${Math.round(x.to/total*100)}</text></g>`;
  }).join('');
  const mx=mine!==undefined?pad+(clamp(mine/total,0,1))*(W-pad*2):null;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${H-18}" x2="${W-pad}" y2="${H-18}" stroke="#e4e7ec"/>
    ${bars}
    ${mx!==null?`<line x1="${mx}" y1="4" x2="${mx}" y2="${H-18}" stroke="#a9843f" stroke-width="1.2" stroke-dasharray="2.5 2"/>
      <text x="${clamp(mx,pad+14,W-pad-14)}" y="9" text-anchor="middle" font-size="7" font-weight="800" fill="#a9843f">본인</text>`:''}
    <text x="${pad}" y="${H-7}" text-anchor="middle" font-size="6.5" fill="#98a2b3">0</text>
  </svg>`;
}

let CUR=null, SEL=new Set();
function openReport(id){CUR=id;SEL=new Set([id]);go('report')}
function renderReport(){
  const el=$('pane-report');
  const PP=P(),list=roster(PP);
  if(!list.length){el.innerHTML=paperBar(false)+`<div class="card"><div class="empty"><b>「${esc(PP.name)}」 시험지에 성적표를 만들 학생이 없습니다</b>③ 성적 입력에서 먼저 등록해 주세요.
    <div style="margin-top:14px"><button class="btn p" onclick="go('scores')">성적 입력으로 이동</button></div></div></div>`;return}
  const A=analyze(PP);
  if(!CUR||!list.find(s=>s.id===CUR))CUR=list[0].id;
  const inPaper=[...SEL].filter(id=>list.some(s=>s.id===id));
  if(!inPaper.length)list.filter(s=>!s.dummy).forEach(s=>SEL.add(s.id));   // 더미는 발행 대상에서 기본 제외

function pageInfo(){
  const r=document.querySelector('#preview .report'),e=$('pgInfo');if(!r||!e)return;
  const A4=297/25.4*96, h=r.getBoundingClientRect().height, raw=h/A4, p=Math.max(1,Math.ceil(raw-.02));
  const tail=raw-Math.floor(raw);
  e.innerHTML=`A4 <b>${p}쪽</b>으로 출력됩니다`
    +(p>1&&tail>0&&tail<.3?` · <span style="color:var(--warn);font-weight:600">마지막 쪽이 거의 비어 있습니다 — 밀도를 「조밀」로 바꾸면 ${p-1}쪽에 담깁니다</span>`:'');
}

/* 성적표의 문항별 정오표 — 칼럼 설정과 배치 방식을 따릅니다 */
function qTableHTML(st,PP,A,det){
  const C=k=>colOn(k,PP);
  const head=`<tr><th style="width:26pt">문항</th>
    ${C('subject')?'<th style="width:38pt">과목</th>':''}
    ${C('sub')?'<th style="width:34pt">세부과목</th>':''}
    ${C('type')?'<th style="width:38pt">유형</th>':''}
    ${C('unit')?'<th style="width:13%">평가 단원</th>':''}
    ${C('topic')?'<th>세부 평가 요소</th>':''}
    ${C('pt')?'<th style="width:26pt">배점</th>':''}
    <th style="width:30pt">정오</th><th style="width:34pt">획득</th>
    ${C('mean')?'<th style="width:44pt">문항 평균</th>':''}
    ${C('rate')?'<th style="width:40pt">정답률</th>':''}
    ${C('diff')?'<th style="width:34pt">난이도</th>':''}</tr>`;
  const row=(sb,q)=>{
    const s=A.qstat[qkey(sb.id,q.n)],m=markOf(st,sb.id,q.n),k=markKind(q,m),v=qScore(q,m);
    return `<tr><td><b>${dispNo(q)}</b></td>
      ${C('subject')?`<td>${esc(sb.name)}</td>`:''}
      ${C('sub')?`<td>${esc(q.sub||'')}</td>`:''}
      ${C('type')?`<td>${esc(q.type||'')}</td>`:''}
      ${C('unit')?`<td class="l">${esc(q.unit)||'-'}</td>`:''}
      ${C('topic')?`<td class="l">${esc(q.topic)||'-'}</td>`:''}
      ${C('pt')?`<td>${fmt(q.pt)}</td>`:''}
      <td class="o${k}">${k==='N'?'·':MARKS[k]}</td><td><b>${v===null?'-':fmt(v)}</b></td>
      ${C('mean')?`<td>${fmt(s.mean)}</td>`:''}
      ${C('rate')?`<td>${pct(s.rate)}</td>`:''}
      ${C('diff')?`<td><span class="dv ${DIFFCLS[s.diff]}">${s.diff}</span></td>`:''}</tr>`;
  };
  const sumRow=(label,qs,got,blanks)=>{
    const cnt=t=>qs.filter(x=>markKind(x.q,markOf(st,x.sb.id,x.q.n))===t).length;
    const before=1+['subject','sub','type','unit','topic','pt'].filter(C).length;
    return `<tr style="background:#f5f7fa"><td colspan="${before+1}" style="text-align:right;font-weight:700">${label}</td>
      <td><b>${fmt(got)}</b></td>
      <td colspan="${['mean','rate','diff'].filter(C).length||1}" style="text-align:left;padding-left:6pt">
        O ${cnt('O')} · △ ${cnt('T')} · X ${cnt('X')} · 무응답 ${cnt('N')}</td></tr>`;
  };
  if(PP.view==='flat'){
    const list=allQuestions(PP);
    const got=PP.subjects.reduce((a,sb)=>a+det[sb.id].sc.got,0);
    return `<div class="rsec"><div class="h">문항별 정오표 <span class="tip">난이도는 응시자 정답률 기준으로 산출됩니다</span></div>
      <table class="rt"><thead>${head}</thead><tbody>
        ${list.map(x=>row(x.sb,x.q)).join('')}
        ${sumRow('합계',list,got)}
      </tbody></table></div>`;
  }
  return PP.subjects.map(sb=>{
    const list=sb.questions.map(q=>({sb,q}));
    return `<div class="rsec"><div class="h">${esc(sb.name)} 문항별 정오표 <span class="tip">난이도는 응시자 정답률 기준으로 산출됩니다</span></div>
      <table class="rt"><thead>${head}</thead><tbody>
        ${list.map(x=>row(x.sb,x.q)).join('')}
        ${sumRow('소계',list,det[sb.id].sc.got)}
      </tbody></table></div>`;
  }).join('');
}

function saveComment(id){
  const e={subj:{}};
  e.lead=$('c_lead').value.trim();e.og=$('c_og').value;e.ob=$('c_ob').value;e.sp=$('c_sp').value;
  paperOf(S.students.find(x=>x.id===id)).subjects.forEach(sb=>{
    const g=$('c_g_'+sb.id),b=$('c_b_'+sb.id),n=$('c_n_'+sb.id);
    if(g)e.subj[sb.id]={g:g.value,b:b.value,n:n.value};
  });
  S.edits[id]=e;save();closeModal();render();toast('코멘트를 저장했습니다');
}
function resetComment(id){delete S.edits[id];save();closeModal();render();toast('자동 생성 코멘트로 되돌렸습니다')}

function selectedStudents(){return roster().filter(s=>SEL.has(s.id))}
function printSel(){
  const list=selectedStudents();if(!list.length)return toast('학생을 선택해 주세요');
  const A=analyze();
  $('printArea').innerHTML=list.map(st=>reportHTML(st,A)).join('');
  toast('인쇄 창에서 "PDF로 저장"을 선택하세요');
  setTimeout(()=>{window.print();setTimeout(()=>$('printArea').innerHTML='',800)},260);
}
const H2C='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
const JSZIP='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
async function pngSel(){
  const list=selectedStudents();if(!list.length)return toast('학생을 선택해 주세요');
  const btnMsg=m=>{const t=$('toast');t.textContent=m;t.classList.add('on')};
  try{
    btnMsg('이미지 생성 준비 중…');
    await loadLib(H2C,()=>window.html2canvas);
    if(list.length>1)await loadLib(JSZIP,()=>window.JSZip);
    const A=analyze();
    const stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:-20000px;top:0;background:#fff;z-index:-1';
    document.body.appendChild(stage);
    const zip=list.length>1?new JSZip():null;
    for(let i=0;i<list.length;i++){
      const st=list[i];
      btnMsg(`이미지 생성 중… ${i+1}/${list.length} (${st.name})`);
      stage.innerHTML=reportHTML(st,A);
      const node=stage.firstElementChild;
      await new Promise(r=>setTimeout(r,60));
      const canvas=await html2canvas(node,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:node.scrollWidth});
      const data=canvas.toDataURL('image/png');
      const fname=`${((examOf(paperOf(st)).examName)||'성적표').replace(/[\\/:*?"<>|]/g,'')}_${st.name}.png`;
      if(zip)zip.file(fname,data.split(',')[1],{base64:true});
      else dl(data,fname);
    }
    if(zip){
      btnMsg('압축 파일 생성 중…');
      const blob=await zip.generateAsync({type:'blob'});
      dl(URL.createObjectURL(blob),`${(E().examName||'성적표').replace(/[\\/:*?"<>|]/g,'')}_${P().name}_${list.length}명.zip`);
    }
    stage.remove();
    toast(list.length>1?`${list.length}명 성적표를 ZIP으로 저장했습니다`:'성적표 이미지를 저장했습니다');
  }catch(e){console.error(e);toast('이미지 생성 실패: '+e.message)}
}

function saveSync(){
  const raw=$('fbCfg').value.trim();
  if(!raw)return toast('firebaseConfig를 붙여넣어 주세요');
  let config;
  try{config=JSON.parse(raw)}catch(e){
    try{config=JSON.parse(raw.replace(/^[^{]*/,'').replace(/[^}]*$/,'').replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}'))}
    catch(e2){return toast('firebaseConfig 형식을 확인해 주세요')}
  }
  if(!config.apiKey||!config.projectId)return toast('apiKey / projectId가 없습니다 — 콘솔에서 다시 복사해 주세요');
  const allow=$('fbAllow').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const room=($('fbRoom').value.trim()||'default').replace(/[\/\s]/g,'-');
  LS.set(KEYFB,JSON.stringify({config,allow,room}));
  closeModal();toast('연결 중…');initFB(true);
}
function inviteLink(){

    .catch(()=>prompt('아래 주소를 복사해 전달하세요',url));
}
function takeInvite(){
  const m=location.hash.match(/^#invite=(.+)$/);if(!m)return false;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!d.config?.apiKey)return false;
    LS.set(KEYFB,JSON.stringify(d));
    INVITE_URL=location.href;                 // 다른 브라우저로 옮길 때 이 주소를 그대로 전달해야 합니다

}
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s)})}
async function initFB(interactive){
  const c=fbCred();if(!c||!c.config)return;
  try{
    syncState('연결 중…');
    const V='10.12.2';
    if(!window.firebase){
      await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
    }
    if(!firebase.apps.length)firebase.initializeApp(c.config);
    const auth=firebase.auth();
    auth.onAuthStateChanged(async u=>{
      if(!u){
        fb.on=false;fb.user=null;if(fb.unsub){fb.unsub();fb.unsub=null}
        syncState('로그인이 필요합니다','#f3c98b',true);
        if(interactive)await fbSignIn(auth);
        return;
      }
      if(c.allow?.length&&!c.allow.includes(u.email)){
        const bad=u.email;
        syncState('접근 불가');await auth.signOut();authHelp('not-allowed',bad);return;
      }
      fb.user=u;fb.db=firebase.firestore();fb.on=true;
      syncState('☁︎ '+u.email.split('@')[0]+' · 공유 중','#8fe3b8');
      subscribeCloud(c.room||'default');
    });
    if(interactive&&!auth.currentUser)await fbSignIn(auth);
  }catch(e){console.error(e);syncState('연결 실패');toast('클라우드 연결 실패 — 설정을 확인해 주세요')}
}
/* 로그인 — 팝업이 막히는 환경(카톡 등 앱 내 브라우저, file://)을 먼저 걸러냅니다 */
const IN_APP=/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps|Whale.*inapp|everytimeApp/i.test(navigator.userAgent);
function envBlock(){
  if(location.protocol==='file:'){
    modal(`<h3>이 화면에서는 로그인할 수 없습니다</h3><div class="mbody">
      <p>파일을 직접 열면(<code>file://</code>) 구글 로그인이 동작하지 않습니다.</p>
      <p>브라우저 주소창에 아래 주소를 입력해 다시 열어 주세요.</p>
      <p style="font-size:15px;font-weight:700;margin-top:10px">${esc(location.host||'aca-report.netlify.app')}</p>
    </div><div class="foot"><button class="btn p" onclick="closeModal()">확인</button></div>`);
    return true;
  }
  if(IN_APP){
    modal(`<h3>다른 브라우저로 열어 주세요</h3><div class="mbody">
      <p>지금은 <b>앱 안의 브라우저</b>(카카오톡 등)로 보고 계십니다. 구글이 보안 정책상 이런 화면에서는 로그인을 허용하지 않습니다.</p>
      <p style="margin-top:10px"><b>카카오톡</b> — 오른쪽 아래(또는 위) <b>⋯</b> → <b>다른 브라우저로 열기</b> (Safari / Chrome)</p>
      <p style="margin-top:6px">주소를 복사해 브라우저 주소창에 직접 붙여넣어도 됩니다.</p>
      <div class="row" style="margin-top:12px"><button class="btn" onclick="copyURL()">🔗 주소 복사</button></div>
      <p class="muted" style="margin-top:10px">한 번만 이렇게 열면, 그 브라우저에는 로그인이 기억됩니다.</p>
    </div><div class="foot"><button class="btn p" onclick="closeModal()">확인</button></div>`);
    return true;
  }
  return false;
}
let INVITE_URL='';
function copyURL(){
  const u=INVITE_URL||location.href;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject())
    .then(()=>toast('주소를 복사했습니다')).catch(()=>prompt('아래 주소를 복사하세요',u));
}
async function fbSignIn(auth){
  if(envBlock()){syncState('로그인 필요');return}
  const P=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(P)}
  catch(e){
    const c=e.code||'';
    if(/popup-blocked|operation-not-supported|cancelled-popup|web-storage-unsupported|internal-error/.test(c)){
      try{await auth.signInWithRedirect(P)}                       // 팝업이 막히면 페이지 이동 방식으로
      catch(e2){authHelp(e2.code||c)}
    }else authHelp(c);
  }
}
function fbSignOut(){if(window.firebase?.apps?.length)firebase.auth().signOut();closeModal();syncState('로그아웃됨')}
let lastRemote='';
function subscribeCloud(room){
  if(fb.unsub)fb.unsub();
  const ref=fb.db.collection('exams').doc(room);
  fb.unsub=ref.onSnapshot(snap=>{
    if(!snap.exists){pushCloud();return}
    const d=snap.data();
    if(!d.json||d.json===lastRemote)return;
    if(d.by===fb.user?.uid&&d.json===JSON.stringify(S))return;
    // 입력 중이면 화면을 갈아엎지 않고 잠시 뒤 다시 시도합니다
    const ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){clearTimeout(applyT);applyT=setTimeout(()=>applyRemote(d),4000);return}
    applyRemote(d);
  },e=>{console.error(e);syncState('동기화 오류','#f3c98b');authHelp(e.code==='permission-denied'?'permission-denied':(e.code||'read-failed'))});
}
let applyT=null;
function applyRemote(d){
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){clearTimeout(applyT);applyT=setTimeout(()=>applyRemote(d),4000);return}
  lastRemote=d.json;
  try{
    if(JSON.stringify(S)===d.json)return;
    const inc=JSON.parse(d.json);
    fb.muted=true;S=migrate(inc);save(false);render();fb.muted=false;
    if(d.by!==fb.user?.uid)toast('공동작업자의 변경사항을 불러왔습니다');
  }catch(e){console.warn(e);fb.muted=false}
}
function pushCloud(){
  if(!fb.on||!fb.db)return;
  const c=fbCred(),json=JSON.stringify(S);
  lastRemote=json;
  fb.db.collection('exams').doc(c.room||'default')
    .set({json,by:fb.user?.uid||'',byEmail:fb.user?.email||'',at:Date.now()})
    .catch(e=>{console.error(e);toast('클라우드 저장 실패 — 권한(규칙)을 확인해 주세요')});
}

/* ============================================================
   6. 시작
============================================================ */
const invited=takeInvite();
load();render();
if(fbCred())initFB(invited);else syncState('');
if(invited)toast('초대 링크로 연결합니다 — 구글 로그인 창에서 계정을 선택해 주세요');
window.addEventListener('beforeprint',()=>{if(!$('printArea').innerHTML&&CUR){const st=S.students.find(s=>s.id===CUR);if(st)$('printArea').innerHTML=reportHTML(st,analyze(paperOf(st)))}});
